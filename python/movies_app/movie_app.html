<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Rating</title>
    <style>
        body { font-family: sans-serif; margin: 40px; line-height: 1.6; }
        .container { max-width: 400px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .input-group { margin-bottom: 15px; }
        /* Flexbox to keep button next to input */
        .inline-group { display: flex; gap: 10px; margin-top: 5px; }
        label { display: block; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 8px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .display-area { margin-top: 20px; padding: 10px; background: #f9f9f9; border-left: 4px solid #007bff; }
        span { font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Movie Rating Form</h2>

        <form method="post" action="/submit">
            <div class="input-group">
                <label for="movieInput">Movie Name:</label>
                <div class="inline-group">
                    <input type="text" name="movie_title" id="movieInput" placeholder="Enter movie title..." required>
                    <button type="submit" id="submitBtn">Submit</button>
                </div>
            </div>

        </form>

        <hr>

        <div class="display-area">
            <p><strong>Movie Selection:</strong> <span>{{ movie_name if movie_name else "---" }}</span></p>
            <p><strong>Average Rating:</strong> <span>{{ movie_score if movie_score else "0.0" }}</span></p>
        </div>
    </div>

</body>
</html>
