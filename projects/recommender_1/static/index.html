<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Recommender Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 40px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .movie-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: translateY(-2px);
        }

        .movie-info {
            flex: 1;
            padding-right: 20px;
        }

        .movie-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 6px 0;
        }

        .genres-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .genre-badge {
            background-color: #334155;
            color: #cbd5e1;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .score-container {
            text-align: right;
            min-width: 120px;
        }

        .score-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .score-value {
            font-family: monospace;
            font-weight: 700;
            color: #34d399;
        }

        .error-message {
            background-color: #7f1d1d;
            border: 1px solid #f87171;
            color: #fca5a5;
            padding: 16px;
            border-radius: 8px;
            display: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Movie Recommendations</h1>
        <div class="subtitle" id="user-heading">Enter a User ID to pull personalized recommendations</div>

        <div class="search-box">
            <input type="number" id="userIdInput" value="4" placeholder="Enter target User ID...">
            <button onclick="fetchRecommendations()">Get Recommendations</button>
        </div>

        <div class="error-message" id="errorBlock"></div>
        <div class="movie-list" id="recommendationsList"></div>
    </div>

    <script>
    async function fetchRecommendations() {
        const userId = document.getElementById('userIdInput').value;
        const listContainer = document.getElementById('recommendationsList');
        const errorBlock = document.getElementById('errorBlock');
        const heading = document.getElementById('user-heading');

        errorBlock.style.display = 'none';
        listContainer.innerHTML = '<div style="text-align:center; color: var(--text-muted);">Calculating Bayesian probabilities...</div>';

        try {
            const response = await fetch(`http://127.0.0.1:8000/recommend?user_id=${userId}`);

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.detail || `Server error: ${response.status}`);
            }

            const data = await response.json();
            listContainer.innerHTML = '';
            heading.innerText = `Top 10 Recommendations for User ${data.user_id}`;

            if (!data.recommendations || data.recommendations.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color: var(--text-muted);">No items matched the pipeline filters.</div>';

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <div class="movie-info">
                        <h3 class="movie-title">
                            ${movie.title || 'Untitled Movie'}
                            <span style="color: var(--text-muted); font-weight: 400; font-size: 1.05rem; margin-left: 4px;">(${movie.year || '--'})</span>
                        </h3>
                        <div class="genres-container">${genresHTML}</div>
                    </div>
                    <div class="score-container">
                        <div class="score-label">Log Likelihood</div>
                        <div class="score-value">${score}</div>
                    </div>
                `;

        } catch (error) {
            listContainer.innerHTML = '';
            errorBlock.innerText = `${error.message}`;
            errorBlock.style.display = 'block';
            heading.innerText = "Execution Paused";
        }
    }

    window.onload = fetchRecommendations;
    </script>
</body>
</html>
